apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: MICROSERVICE_FILES_HOST
               valueFrom:
                 secretKeyRef:
                   name: files-microservices-production-config-secret
                   key: MICROSERVICE_FILES_HOST
             - name: MICROSERVICE_FILES_PORT
               valueFrom:
                 secretKeyRef:
                   name: files-microservices-production-config-secret
                   key: MICROSERVICE_FILES_PORT
             - name: CORS_ALLOWED_ORIGINS
               valueFrom:
                 secretKeyRef:
                   name: files-microservices-production-config-secret
                   key: CORS_ALLOWED_ORIGINS
             - name: POSTGRES_FILES_URL
               valueFrom:
                 secretKeyRef:
                   name: files-microservices-production-config-secret
                   key: POSTGRES_FILES_URL
             - name: RABBITMQ_URI
               valueFrom:
                 secretKeyRef:
                   name: files-microservices-production-config-secret
                   key: RABBITMQ_URI
             - name: NODE_ENV
               valueFrom:
                 secretKeyRef:
                   name: files-microservices-production-config-secret
                   key: NODE_ENV
